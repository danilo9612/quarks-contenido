<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&family=Tomorrow:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --c-primary: #141414;
  --c-accent: #FF2978;
  --c-bg: #141414;
  --c-text: #E5E5E5;
  --c-muted: #737373;
  --c-surface: #392F6299;
  --c-accent2: #8A02FF;
  --c-accent3: #00B9E8;
  --font-display: 'Urbanist', sans-serif;
  --font-body: 'Roboto', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --font-hero: 'Tomorrow', 'Urbanist', sans-serif;
  --font-script: 'Caveat', cursive;
  --slide-accent: #FF2978;
  --grad-electric: linear-gradient(135deg, #FF2978, #8A02FF, #00B9E8);
  --grad-cosmic: linear-gradient(135deg, #0a0010, #1a0040, #FF2978);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1080px;
  height: 1080px;
  overflow: hidden;
}
body {
  background: var(--c-bg);
  color: var(--c-text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.canvas {
  position: relative;
  width: 1080px;
  height: 1080px;
  padding: 96px 96px 120px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 32px;
}

/* ── Texture overlay (same depth treatment as carousel) ── */
.canvas-texture {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.canvas-texture::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--slide-accent) 14%, transparent) 0%, transparent 40%),
    linear-gradient(315deg, color-mix(in srgb, var(--c-primary) 60%, transparent) 0%, transparent 50%);
}
.canvas-texture::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(to right, color-mix(in srgb, var(--c-text) 7%, transparent) 1px, transparent 1px),
    linear-gradient(to bottom, color-mix(in srgb, var(--c-text) 7%, transparent) 1px, transparent 1px);
  background-size: 60px 60px;
  mask: linear-gradient(to right, black 0, transparent 14%, transparent 86%, black 100%),
        linear-gradient(to bottom, black 0, transparent 14%, transparent 86%, black 100%);
  mask-composite: add;
  -webkit-mask-composite: source-over;
}

/* ── Brand corner mark — discrete logo, bottom-right ── */
.brand-mark {
  position: absolute;
  bottom: 48px;
  right: 56px;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 14px;
  opacity: 0.85;
}
.brand-mark img {
  height: 56px;
  width: auto;
  display: block;
}
.brand-mark .brand-name {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--c-text);
  text-transform: uppercase;
}

/* ── Headlines ── */
.headline {
  font-family: var(--font-display);
  font-weight: 800;
  color: var(--c-text);
  letter-spacing: -0.02em;
  line-height: 1.05;
  position: relative;
  z-index: 1;
}
.headline.xl { font-size: 110px; line-height: 1.02; }
.headline.lg { font-size: 88px; line-height: 1.05; }
.headline.md { font-size: 64px; line-height: 1.08; }
.headline.sm { font-size: 52px; line-height: 1.12; }

.body {
  font-family: var(--font-body);
  font-size: 32px;
  line-height: 1.35;
  color: var(--c-text);
  font-weight: 400;
  max-width: 860px;
  position: relative;
  z-index: 1;
}
.body.muted { color: var(--c-muted); }

.kicker {
  display: inline-flex;
  align-items: center;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--slide-accent);
  position: relative;
  z-index: 1;
}

/* ── Cosmic background variant (for data_stat) ── */
.canvas.cosmic {
  background: var(--grad-cosmic);
}

/* ── Glow blob (CSS-generated — no asset needed) ──
   Two variants: primary (coral→violet) and secondary (cyan→violet).
   Position classes: top-right | top-left | bottom-right | bottom-left | center */
.glow-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.55;
}
.glow-blob.primary {
  width: 420px; height: 420px;
  background: radial-gradient(circle at 40% 40%,
    rgba(255,41,120,0.75) 0%,
    rgba(138,2,255,0.45) 50%,
    transparent 75%);
}
.glow-blob.secondary {
  width: 340px; height: 340px;
  background: radial-gradient(circle at 50% 50%,
    rgba(0,185,232,0.65) 0%,
    rgba(138,2,255,0.30) 55%,
    transparent 75%);
}
.glow-blob.top-right    { top: -60px;  right: -60px;  }
.glow-blob.top-left     { top: -60px;  left: -60px;   }
.glow-blob.bottom-right { bottom: 80px; right: -40px; }
.glow-blob.bottom-left  { bottom: 80px; left: -40px;  }
.glow-blob.center       { top: 50%; left: 50%; transform: translate(-50%, -50%); }

/* ── Gradient ring (CSS, no asset) ── */
.gradient-ring {
  position: absolute;
  border-radius: 50%;
  background: linear-gradient(var(--c-bg), var(--c-bg)) padding-box,
              var(--grad-electric) border-box;
  border: 2px solid transparent;
  pointer-events: none;
  z-index: 0;
  opacity: 0.35;
}
.gradient-ring.sm { width: 160px; height: 160px; }
.gradient-ring.md { width: 280px; height: 280px; }
.gradient-ring.lg { width: 420px; height: 420px; }
.gradient-ring.top-right    { top: -80px;  right: -80px;  }
.gradient-ring.top-left     { top: -80px;  left: -80px;   }
.gradient-ring.bottom-right { bottom: 60px; right: -60px; }
.gradient-ring.bottom-left  { bottom: 60px; left: -60px;  }

/* ── Dotted ring (CSS, no asset) ── */
.dotted-ring {
  position: absolute;
  border-radius: 50%;
  border: 1.5px dashed color-mix(in srgb, var(--c-text) 22%, transparent);
  pointer-events: none;
  z-index: 0;
}
.dotted-ring.sm { width: 120px; height: 120px; }
.dotted-ring.md { width: 220px; height: 220px; }
.dotted-ring.lg { width: 360px; height: 360px; }
.dotted-ring.top-right    { top: -40px;  right: -40px;  }
.dotted-ring.top-left     { top: -40px;  left: -40px;   }
.dotted-ring.bottom-right { bottom: 80px; right: -40px; }
.dotted-ring.bottom-left  { bottom: 80px; left: -40px;  }

/* ── Step badge — circular numbered marker (for image_insight numbered variant) ── */
.step-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 72px; height: 72px;
  border-radius: 50%;
  background: var(--slide-accent);
  color: var(--c-bg);
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 900;
  flex: 0 0 auto;
}



/* ── Full-bleed layout ── */
.canvas {
  padding: 0;
  flex-direction: column;
  justify-content: flex-end;
  align-items: stretch;
  text-align: left;
  position: relative;
}

/* Hide default texture — this template manages its own layers */
.canvas-texture { display: none; }

/* ── Override brand-mark: bottom-right inside panel, siempre en la capa más alta ── */
.brand-mark {
  position: absolute !important;
  bottom: 44px !important;
  right: 52px !important;
  opacity: 1 !important;
  z-index: 20 !important;
}
.brand-mark img { height: 58px !important; }

/* Gradient overlay — cubre toda la foto, también detrás de la card */
.vt-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    160deg,
    rgba(10,0,16,0.55)   0%,
    rgba(26,0,64,0.45)   40%,
    rgba(138,2,255,0.30) 70%,
    rgba(255,41,120,0.40) 100%
  );
}

/* Extra glow punch (visible even con foto) */
.vt-glow-a {
  position: absolute;
  width: 500px; height: 500px;
  border-radius: 50%;
  top: -160px; right: -80px;
  background: radial-gradient(circle,
    rgba(255,41,120,0.38) 0%,
    rgba(138,2,255,0.18) 50%,
    transparent 70%);
  filter: blur(60px);
}

.vt-glow-b {
  position: absolute;
  width: 360px; height: 360px;
  border-radius: 50%;
  bottom: -60px; left: -40px;
  background: radial-gradient(circle,
    rgba(0,185,232,0.28) 0%,
    rgba(138,2,255,0.12) 55%,
    transparent 72%);
  filter: blur(48px);
}

/* ── Bottom text panel — solo dark translúcido, gradient border via mask ring ── */
.text-panel {
  position: relative;
  z-index: 2;
  min-height: 48%;
  border-radius: 22px 22px 0 0;
  padding: 64px 60px 88px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 26px;
  margin: 0 -2px -2px -2px;
  background: rgba(15, 15, 22, 0.82);
}

/* Gradient border SOLO en el ring de 2px — no sangra detrás del padding-box */
.text-panel::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 2px;
  background: linear-gradient(90deg, #FF2978 0%, #8A02FF 50%, #00B9E8 100%);
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

/* ── Eyebrow row ── */
.eyebrow-row {
  display: flex;
  align-items: center;
  gap: 22px;
}

.eyebrow-label {
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  color: var(--slide-accent);
  flex: 0 0 auto;
}

.eyebrow-dots {
  flex: 1;
  height: 1.5px;
  background-image: repeating-linear-gradient(
    to right,
    color-mix(in srgb, var(--c-text) 28%, transparent) 0px,
    color-mix(in srgb, var(--c-text) 28%, transparent) 4px,
    transparent 4px,
    transparent 12px
  );
}

/* ── Quote ── */
.quote-text {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 64px;
  line-height: 1.07;
  letter-spacing: -0.02em;
  color: var(--c-text);
}

/* Headline / news mode: normal casing (pass data.headline_case: true) */
.quote-text.headline-case {
  text-transform: none;
  letter-spacing: -0.025em;
}

/* ── Attribution pill ── */
.attr-pill {
  display: inline-flex;
  align-items: center;
  padding: 12px 34px;
  border-radius: 9999px;
  background: color-mix(in srgb, var(--slide-accent) 18%, transparent);
  border: 1.5px solid color-mix(in srgb, var(--slide-accent) 42%, transparent);
  font-family: var(--font-body);
  font-size: 26px;
  font-weight: 500;
  color: var(--c-text);
  width: fit-content;
}


</style>
