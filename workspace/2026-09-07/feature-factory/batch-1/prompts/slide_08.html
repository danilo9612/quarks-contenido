<style>
:root {
  /* Paleta del sistema light editorial — fija, no depende de brand_style_guide */
  --st-text:        #6716D9;   /* violeta del texto principal */
  --st-chip-bg:     #6A02FF;   /* fondo del chip */
  --st-chip-text:   #FFFFFF;
  --st-footer-text: #FFFFFF;
  --st-rule:        rgba(255,255,255,0.72);
  --st-bg:          #F6E9FF;   /* base lavanda */
  --font-display:   'Wix Madefor Display', 'Urbanist', sans-serif;
  --font-ui:        'Inter', 'Helvetica Neue', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1080px;
  height: 1350px;
  overflow: hidden;
}
body {
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.slide {
  position: relative;
  width: 1080px;
  height: 1350px;
  overflow: hidden;
  background: var(--st-bg);
}

/* ── Fondo: malla de gradientes lavanda → violeta ── */
.bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background:
    /* bloom claro justo antes de la banda (lado izquierdo) */
    radial-gradient(36% 11% at 28% 81%,  rgba(246,233,255,0.62) 0%, rgba(246,233,255,0) 74%),
    /* violeta profundo abajo a la derecha */
    radial-gradient(62% 40% at 96% 100%, #7328E4 0%, rgba(115,40,228,0.60) 34%, rgba(115,40,228,0) 70%),
    /* purpura abajo al centro-izquierda */
    radial-gradient(58% 32% at 30% 104%, #AE72F2 0%, rgba(174,114,242,0.50) 44%, rgba(174,114,242,0) 78%),
    /* subida purpura media */
    radial-gradient(92% 26% at 54% 88%,  rgba(190,146,246,0.70) 0%, rgba(190,146,246,0) 74%),
    /* lavanda del borde izquierdo */
    radial-gradient(44% 30% at 0% 44%,   rgba(228,213,251,0.85) 0%, rgba(228,213,251,0) 74%),
    /* lavanda suave del borde derecho */
    radial-gradient(46% 30% at 101% 58%, rgba(226,209,250,0.75) 0%, rgba(226,209,250,0) 76%),
    linear-gradient(178deg,
      var(--st-bg) 0%,
      var(--st-bg) 36%,
      #F2E2FE 58%,
      #E3CEFA 74%,
      #C79BF4 87%,
      #9E62EE 100%);
}
/* Halo arriba a la izquierda — mismo violeta que el degradé de abajo a la derecha */
.bg.corner-glow::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(40% 27% at -3% -3%,
    rgba(115,40,228,0.72) 0%,
    rgba(115,40,228,0.28) 46%,
    rgba(115,40,228,0) 76%);
}

/* ── Logo ──
   Camino preferido: assets/quarks_logo_color.png (en la skill o en quarks-brand).
   Fallback: isotipo enmascarado con gradiente cónico + wordmark tipografiado. */

  position: absolute;
  top: 112px;
  left: 118px;
  height: 90px;
  width: auto;
  object-fit: contain;
  display: block;
  z-index: 4;
}
.logo-lockup {
  position: absolute;
  top: 112px;
  left: 118px;
  display: flex;
  align-items: center;
  gap: 26px;
  z-index: 4;
}

.logo-wordmark {
  font-family: var(--font-display);
  font-size: 54px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1;
  color: var(--st-text);
}

/* ── Bloque de texto ── */
.stage {
  position: absolute;
  top: 413px;
  left: 120px;
  right: 120px;
  z-index: 3;
  display: flex;
  flex-direction: column;
}
.stage.left   { align-items: flex-start; text-align: left;   }
.stage.center { align-items: center;     text-align: center; }

.statement {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 62px;
  line-height: 1.26;
  letter-spacing: 0;
  color: var(--st-text);
  max-width: 690px;
}
.stage.center .statement { max-width: 830px; }
.statement b, .statement strong { font-weight: 700; }
.statement.secondary { margin-top: 110px; }

/* ── Chip ── */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 27px;
  height: 65px;
  padding: 13px 27px;
  border-radius: 53px;
  background: var(--st-chip-bg);
  color: var(--st-chip-text);
  font-family: var(--font-ui);
  font-weight: 500;
  font-size: 32px;
  line-height: 1;
  white-space: nowrap;
  z-index: 3;
}
.chip.flow   { margin-top: 28px; }
.chip.bottom {
  position: absolute;
  bottom: 257px;
  left: 118px;
}
.chip.bottom.center {
  left: 50%;
  transform: translateX(-50%);
}

/* ── Orbe con ícono (abajo a la derecha) ── */
.orb {
  position: absolute;
  top: 660px;
  right: -4px;
  width: 503px;
  height: 503px;
  border-radius: 50%;
  background: linear-gradient(180deg,
    rgba(208,138,250,0.45) 3.37%,
    rgba(156,0,251,0.90) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
}
.orb i {
  font-size: 210px;
  line-height: 1;
  color: #FFFFFF;
  transform: translateY(0px);
}

/* ── Footer: reglas + fila URL / bookmark / flecha ── */
.rule-h {
  position: absolute;
  left: 0; right: 0;
  top: 1124px;
  height: 2px;
  background: var(--st-rule);
  z-index: 3;
}
.rule-v {
  position: absolute;
  left: 837px;
  top: 1124px;
  bottom: 0;
  width: 2px;
  background: var(--st-rule);
  z-index: 3;
}
.footer-row {
  position: absolute;
  top: 1216px;
  left: 147px;
  width: 827px;
  height: 49px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 4;
}
.footer-url {
  font-family: var(--font-ui);
  font-weight: 400;
  font-size: 30px;
  line-height: 1;
  letter-spacing: 0;
  color: var(--st-footer-text);
}
.footer-icon {
  color: var(--st-footer-text);
  display: block;
}
</style>
