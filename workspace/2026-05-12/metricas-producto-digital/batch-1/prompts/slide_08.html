<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&family=Tomorrow:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --c-primary: #141414;
  --c-accent: #00B9E8;
  --c-bg: #141414;
  --c-text: #E5E5E5;
  --c-muted: #737373;
  --c-surface: #392F6299;
  --c-accent2: #8A02FF;
  --c-accent3: #00B9E8;
  --c-footer-text: #FFFFFF;
  --font-display: 'Urbanist', sans-serif;
  --font-body: 'Roboto', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --font-hero: 'Tomorrow', 'Urbanist', sans-serif;
  --font-script: 'Caveat', cursive;
  --slide-accent: #8A02FF;
  --grad-electric: linear-gradient(135deg, #FF2978, #8A02FF, #00B9E8);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1080px;
  height: 1080px;
  overflow: hidden;
}
body {
  background: var(--c-bg);
  color: var(--c-text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.slide {
  position: relative;
  width: 1080px;
  height: 1080px;
  padding: 64px 80px 100px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 28px;
}
.slide.center { justify-content: center; }
.slide.end { justify-content: flex-end; }

/* ── Background photo support ── */
.slide.has-bg {
  background-size: cover;
  background-position: center;
}
/* Stronger overlay so text is always readable regardless of image brightness */
.slide.has-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    160deg,
    rgba(0,0,0,0.62) 0%,
    rgba(0,0,0,0.45) 50%,
    rgba(0,0,0,0.70) 100%
  );
  z-index: 0;
}
/* Force all text white when rendered over a photo — guarantees contrast */
.slide.has-bg .headline,
.slide.has-bg h1,
.slide.has-bg h2,
.slide.has-bg .kicker,
.slide.has-bg .kicker.pill,
.slide.has-bg p,
.slide.has-bg .subhead,
.slide.has-bg .body,
.slide.has-bg .social-handle,
.slide.has-bg .handle-badge,
.slide.has-bg .save-later {
  color: #FFFFFF !important;
}
.slide.has-bg .kicker.pill {
  background: rgba(255,255,255,0.18) !important;
  border: 1.5px solid rgba(255,255,255,0.35) !important;
  backdrop-filter: blur(4px);
}

/* ── Watermark (large ghosted text — much more prominent now) ── */
.watermark {
  position: absolute;
  top: -30px; left: 20px; right: 0; bottom: 0;
  display: flex;
  align-items: flex-start;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.watermark span {
  font-family: var(--font-serif);
  font-weight: 900;
  font-size: 440px;
  line-height: 1;
  color: var(--c-text);
  opacity: 0.06;
  letter-spacing: -0.04em;
  white-space: nowrap;
  user-select: none;
}

/* ── Header row (slide counter only — absolutely positioned so it's
   always at the exact same spot regardless of template or decorations) ── */
.header-row {
  position: absolute;
  top: 56px;
  right: 72px;
  z-index: 5;
}
.slide-counter {
  font-family: var(--font-mono);
  font-size: 24px;
  font-weight: 500;
  color: var(--c-muted);
  opacity: 0.7;
  letter-spacing: 0.05em;
}

/* ── Kicker — Caveat handwriting script ── */
.kicker {
  display: inline-block;
  font-family: var(--font-script);
  font-size: 50px;
  font-weight: 600;
  color: var(--slide-accent);
  letter-spacing: 0.01em;
  line-height: 1.1;
}
.kicker.pill {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  background: var(--slide-accent);
  color: var(--c-bg);
  padding: 10px 22px;
  border-radius: 999px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.kicker.step {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  color: var(--slide-accent);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-style: normal;
}

/* Command pill — large monospace badge for slash commands */
.command-pill {
  display: inline-flex;
  align-items: center;
  background: var(--slide-accent);
  color: var(--c-bg);
  font-family: var(--font-mono);
  font-size: 52px;
  font-weight: 700;
  padding: 16px 36px;
  border-radius: 18px;
  letter-spacing: -0.01em;
  line-height: 1;
}

/* ── Headlines ── */
.headline {
  font-family: var(--font-display);
  font-weight: 800;
  color: var(--c-text);
  letter-spacing: -0.02em;
  line-height: 1.05;
  position: relative;
  z-index: 1;
}
/* Hook headline — Tomorrow, DS hero-only font */
.headline.xl {
  font-family: var(--font-hero);
  font-size: 112px;
  font-weight: 700;
  line-height: 1.0;
  letter-spacing: -0.02em;
  /* Cap width so overlay mascot never sits on top of text */
  max-width: 820px;
}
.headline.lg { font-size: 104px; line-height: 1.0; }
.headline.md { font-size: 78px; line-height: 1.05; }
.headline.sm { font-size: 64px; line-height: 1.08; }

/* Subhead — Caveat script for personality */
.subhead {
  font-family: var(--font-script);
  font-size: 46px;
  line-height: 1.3;
  color: var(--c-muted);
  font-weight: 500;
  max-width: 820px;
  position: relative;
  z-index: 1;
}
/* ── Body scale — DS tokens (Roboto, letter-spacing: 0) ── */
.body {
  font-family: var(--font-body);
  font-size: 36px;          /* body-large */
  line-height: 43px;
  color: var(--c-text);
  font-weight: 400;
  max-width: 860px;
  margin-top: 20px;         /* extra breathing room after headlines */
  position: relative;
  z-index: 1;
}
.body.muted { color: var(--c-muted); }
.body-medium {
  font-family: var(--font-body);
  font-size: 24px;          /* body-medium */
  line-height: 29px;
  color: var(--c-text);
  font-weight: 400;
  position: relative;
  z-index: 1;
}
.body-small {
  font-family: var(--font-body);
  font-size: 19px;          /* body-small */
  line-height: 23px;
  color: var(--c-text);
  font-weight: 400;
  position: relative;
  z-index: 1;
}
.body-xsmall {
  font-family: var(--font-body);
  font-size: 14px;          /* body-xsmall */
  line-height: 17px;
  color: var(--c-text);
  font-weight: 400;
  position: relative;
  z-index: 1;
}

/* Defensive: no text-decoration on any headline or its children */
.headline, .headline *, h1, h1 *, h2, h2 * {
  text-decoration: none !important;
}

/* ── Professional icon (Font Awesome) ── */
.slide-icon-fa {
  font-size: 76px;
  line-height: 1;
  display: block;
  position: relative;
  z-index: 1;
  color: var(--slide-accent);
  flex: 0 0 auto;
}
/* Emoji fallback — kept for backwards compat */
.slide-icon {
  font-size: 76px;
  line-height: 1;
  display: block;
  position: relative;
  z-index: 1;
  flex: 0 0 auto;
}

/* ── 3-Card bullet layout — cards stretch to fill remaining slide space ── */
.card-stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
  z-index: 1;
  flex: 1; /* consume all leftover vertical space */
  min-height: 0;
  overflow: hidden; /* hard clip if content is still too tall */
}
/* Standard card — matches Figma "Standard card": dark navy-purple surface, 18px radius */
.card-item {
  background: var(--c-surface);
  border: 1px solid color-mix(in srgb, var(--c-text) 8%, transparent);
  border-radius: 18px;
  padding: 20px 32px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1; /* each card expands equally to fill the stack */
  justify-content: center;
  overflow: hidden;
  min-height: 0;
}
/* Stroke card — matches Figma "Stroke card": gradient border (electric gradient) */
.card-item.stroke {
  background: linear-gradient(var(--c-surface), var(--c-surface)) padding-box,
              var(--grad-electric) border-box;
  border: 2px solid transparent;
}
.card-item-title {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 800;
  color: var(--c-text);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  flex: 0 0 auto;
}
.card-item-body {
  font-family: var(--font-body);
  font-size: 24px;          /* body-medium */
  font-weight: 400;
  color: color-mix(in srgb, var(--c-text) 72%, transparent);
  line-height: 29px;
  flex: 0 0 auto;
  /* Hard cap at 2 lines — prevents overflow regardless of copy length */
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
/* Content image block — full-height Imagen photo */
.slide-content-image {
  flex: 1;
  border-radius: 20px;
  overflow: hidden;
  min-height: 0;
  position: relative;
  z-index: 1;
}
.slide-content-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 20px;
  display: block;
}
/* Graphic image block — Gemini-generated chart/diagram, compact card */
.slide-graphic-image {
  flex: 0 0 auto;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  z-index: 1;
  border: 1px solid color-mix(in srgb, var(--c-text) 10%, transparent);
}
.slide-graphic-image img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 16px;
}

/* Illustration image block — 3D concept illustration centered in lower half.
   No card border. Centered, max height ~380px, white/transparent bg assets
   look great against both dark and light slide backgrounds. */
.slide-illustration {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
  max-height: 420px;
}
.slide-illustration img {
  max-width: 85%;
  max-height: 100%;
  object-fit: contain;
  display: block;
  /* Drop shadow so illustration pops off dark/light backgrounds */
  filter: drop-shadow(0 8px 32px rgba(0,0,0,0.35));
}

/* ── Code / prompt block ── */
.code-label {
  font-size: 42px;
  font-weight: 600;
  color: var(--c-muted);
  font-family: var(--font-script);
  display: flex;
  align-items: center;
  gap: 12px;
}
.code-label-arrow {
  font-size: 36px;
  color: var(--slide-accent);
  font-family: var(--font-body);
  font-style: normal;
}
.code-block {
  background: color-mix(in srgb, var(--c-primary) 80%, var(--c-bg) 20%);
  border: 1.5px solid color-mix(in srgb, var(--c-text) 12%, transparent);
  border-radius: 20px;
  padding: 40px 44px;
  font-family: var(--font-mono);
  font-size: 28px;
  line-height: 1.6;
  color: var(--c-text);
  position: relative;
  z-index: 1;
}
.code-block mark {
  background: none;
  color: var(--slide-accent);
  font-weight: 600;
}
.code-block .code-dim {
  color: var(--c-muted);
}

/* ── Flow diagram ── */
.flow-row {
  display: flex;
  align-items: center;
  gap: 0;
  position: relative;
  z-index: 1;
}
.flow-box {
  flex: 1;
  background: color-mix(in srgb, var(--c-text) 6%, transparent);
  border: 1.5px solid color-mix(in srgb, var(--c-text) 14%, transparent);
  border-radius: 16px;
  padding: 28px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.flow-box.highlighted {
  background: color-mix(in srgb, var(--slide-accent) 18%, transparent);
  border-color: var(--slide-accent);
}
.flow-box-label {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 500;
  color: var(--c-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.flow-box-title {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 700;
  color: var(--c-text);
  line-height: 1.1;
}
.flow-arrow {
  flex: 0 0 auto;
  width: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--slide-accent);
  font-size: 40px;
  font-weight: 900;
}

/* ── Tag/chip pills — filled solid accent colors, matches Figma chips ──
   Cycles through the 3 Quarks accent colors: coral → violet → cyan.
   White text on all three (all meet contrast on their respective fills). */
.tag-pills-inline {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  position: relative;
  z-index: 2;
}
.tag-pill {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: #FFFFFF;
  background: var(--slide-accent);
  border-radius: 999px;
  padding: 8px 22px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.tag-pill:nth-child(1) { background: var(--c-accent);  }
.tag-pill:nth-child(2) { background: var(--c-accent2); }
.tag-pill:nth-child(3) { background: var(--c-accent3); }
/* 4th+ fallback to surface with border so extra tags don't clash */
.tag-pill:nth-child(n+4) {
  background: var(--c-surface);
  border: 1.5px solid color-mix(in srgb, var(--c-text) 20%, transparent);
  color: var(--c-text);
}

/* ── Social footer (bottom of every slide) ──
   LEFT:  [brand logo OR brand name]
   RIGHT: [bookmark-icon accent] [Guardá este post — contrast-aware]
   Text color adapts to background: dark bg → white, light bg → brand text color. ── */
.social-footer {
  position: absolute;
  bottom: 38px;
  left: 72px;
  right: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 3;
}
.brand-identity {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  color: var(--c-footer-text);
  letter-spacing: 0.01em;
}
.brand-logo-footer {
  height: 64px;
  width: auto;
  flex-shrink: 0;
  object-fit: contain;
}
.save-later {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  color: var(--c-footer-text);
  letter-spacing: 0.01em;
}
.save-icon {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  color: var(--slide-accent);
}

/* ── Footer accent bar ── */
.footer-bar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 12px;
  background: var(--slide-accent);
  z-index: 2;
}

/* ── Stat ── */
.stat-number {
  font-family: var(--font-display);
  font-size: 300px;
  font-weight: 900;
  line-height: 0.9;
  color: var(--slide-accent);
  letter-spacing: -0.03em;
}

/* ── Step badge ── */
.step-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 96px; height: 96px;
  border-radius: 50%;
  background: var(--slide-accent);
  color: var(--c-bg);
  font-family: var(--font-display);
  font-size: 54px;
  font-weight: 900;
}

/* ── Quote ── */
.quote-mark {
  font-family: var(--font-display);
  font-size: 260px;
  font-weight: 900;
  line-height: 0.8;
  color: var(--slide-accent);
  opacity: 0.35;
}

/* ── CTA box ── */
.cta-box {
  border: 6px solid var(--slide-accent);
  border-radius: 28px;
  padding: 56px 48px;
  background: color-mix(in srgb, var(--slide-accent) 8%, transparent);
}
.cta-call {
  font-family: var(--font-display);
  font-size: 66px;
  font-weight: 800;
  line-height: 1.0;
  color: var(--c-text);
}
.cta-sub {
  margin-top: 20px;
  font-size: 30px;
  color: var(--c-muted);
  font-weight: 500;
}

/* ── Slide texture: diagonal gradient + grain (EVERY slide) ── */
/* This is the must-have aesthetic layer — accent wash top-left, deep
   shadow bottom-right, grain noise over the top for organic depth.
   Works on dark (dark-neon) AND light (white-bold / cream-ink) palettes. */
.slide-texture {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  /* Diagonal accent gradient — accent color bleeds in from top-left corner,
     primary/dark shadow deepens the bottom-right for dimension */
  background:
    linear-gradient(
      145deg,
      color-mix(in srgb, var(--slide-accent) 14%, transparent) 0%,
      transparent 40%,
      color-mix(in srgb, var(--c-primary) 40%, transparent) 100%
    );
}
/* Grid pattern overlay — visible only around the edges, invisible inside the
   content safe zone. Two linear mask gradients (H + V) composited additively
   produce a rectangular frame: opaque at all 4 edges, transparent in the center. */
.slide-texture::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(color-mix(in srgb, var(--c-text) 8%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--c-text) 8%, transparent) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image:
    linear-gradient(to right, black 0%, transparent 16%, transparent 84%, black 100%),
    linear-gradient(to bottom, black 0%, transparent 14%, transparent 86%, black 100%);
  mask-composite: add;
  -webkit-mask-image:
    linear-gradient(to right, black 0%, transparent 16%, transparent 84%, black 100%),
    linear-gradient(to bottom, black 0%, transparent 14%, transparent 86%, black 100%);
  -webkit-mask-composite: source-over;
}
/* On photo-backed slides pull the grid back further */
.slide.has-bg .slide-texture::after {
  background-image:
    linear-gradient(color-mix(in srgb, var(--c-text) 5%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--c-text) 5%, transparent) 1px, transparent 1px);
}

/* ── Light / cream background palette support ── */
/* When the brand background is light (cream, white, off-white), the default dark
   diagonal gradient reads too heavy. Adding .light-bg on <body> activates these
   lighter overrides so texture stays subtle and cards get proper contrast. */
body.light-bg .slide-texture {
  background:
    linear-gradient(
      145deg,
      color-mix(in srgb, var(--slide-accent) 8%, transparent) 0%,
      transparent 45%,
      color-mix(in srgb, var(--c-text) 6%, transparent) 100%
    );
}
body.light-bg .slide-texture::after {
  background-image:
    linear-gradient(color-mix(in srgb, var(--c-text) 6%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--c-text) 6%, transparent) 1px, transparent 1px);
}
/* Cards on light bg: slightly darker tint so they pop */
body.light-bg .card-item {
  background: color-mix(in srgb, var(--c-text) 7%, transparent);
  border-color: color-mix(in srgb, var(--c-text) 14%, transparent);
}
body.light-bg .card-item.stroke {
  background: linear-gradient(color-mix(in srgb, var(--c-text) 7%, transparent),
              color-mix(in srgb, var(--c-text) 7%, transparent)) padding-box,
              var(--grad-electric) border-box;
  border: 2px solid transparent;
}

/* ── Gradient text headline (cream/lifestyle niche style) ── */
/* Apply class="gradient-text" to any headline element for gradient fill.
   Gradient runs from accent at top to primary/text at bottom — matches
   the @alex.snippet terracotta-to-black style. */
.gradient-text {
  background: linear-gradient(175deg, var(--slide-accent) 0%, var(--c-text) 65%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  display: inline-block;
}

/* ── Glow blob (CSS-generated — no asset needed) ──
   Two variants: primary (coral→violet) and secondary (cyan→violet).
   Position classes: top-right | top-left | bottom-right | bottom-left | center */
.glow-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.55;
}
.glow-blob.primary {
  width: 420px; height: 420px;
  background: radial-gradient(circle at 40% 40%,
    rgba(255,41,120,0.75) 0%,
    rgba(138,2,255,0.45) 50%,
    transparent 75%);
}
.glow-blob.secondary {
  width: 340px; height: 340px;
  background: radial-gradient(circle at 50% 50%,
    rgba(0,185,232,0.65) 0%,
    rgba(138,2,255,0.30) 55%,
    transparent 75%);
}
.glow-blob.top-right    { top: -60px;  right: -60px;  }
.glow-blob.top-left     { top: -60px;  left: -60px;   }
.glow-blob.bottom-right { bottom: 80px; right: -40px; }
.glow-blob.bottom-left  { bottom: 80px; left: -40px;  }
.glow-blob.center       { top: 50%; left: 50%; transform: translate(-50%, -50%); }

/* ── Gradient ring (CSS — no asset needed) ── */
.gradient-ring {
  position: absolute;
  border-radius: 50%;
  background: transparent;
  background: linear-gradient(var(--c-bg), var(--c-bg)) padding-box,
              var(--grad-electric) border-box;
  border: 2px solid transparent;
  pointer-events: none;
  z-index: 0;
  opacity: 0.35;
}
.gradient-ring.sm { width: 160px; height: 160px; }
.gradient-ring.md { width: 280px; height: 280px; }
.gradient-ring.lg { width: 420px; height: 420px; }
.gradient-ring.top-right    { top: -80px;  right: -80px;  }
.gradient-ring.top-left     { top: -80px;  left: -80px;   }
.gradient-ring.bottom-right { bottom: 60px; right: -60px; }

/* ── Dotted ring — dashed circle accent (CSS, no asset) ── */
.dotted-ring {
  position: absolute;
  border-radius: 50%;
  border: 1.5px dashed color-mix(in srgb, var(--c-text) 22%, transparent);
  pointer-events: none;
  z-index: 0;
}
.dotted-ring.sm { width: 120px; height: 120px; }
.dotted-ring.md { width: 220px; height: 220px; }
.dotted-ring.lg { width: 360px; height: 360px; }
.dotted-ring.top-right    { top: -40px;  right: -40px;  }
.dotted-ring.top-left     { top: -40px;  left: -40px;   }
.dotted-ring.bottom-right { bottom: 80px; right: -40px; }

/* ── Starburst lines — radial decorative element (CSS/SVG, no asset) ── */
.starburst {
  position: absolute;
  pointer-events: none;
  z-index: 0;
  opacity: 0.18;
}
.starburst.top-left  { top: 40px;  left: 40px;  }
.starburst.top-right { top: 40px;  right: 40px; }
.starburst.center    { top: 50%;   left: 50%;   transform: translate(-50%, -50%); }

/* ── Decorative asset image (orbs, 3D shapes from assets/decorative/) ──
   Positioned as a floating accent, not overlapping main content.
   deco_position: top-right | top-left | bottom-right | mid-right */
.deco-wrap {
  position: absolute;
  pointer-events: none;
  z-index: 2;
}
.deco-wrap.top-right    { top: 72px;  right: 72px;  }
.deco-wrap.top-left     { top: 72px;  left: 72px;   }
.deco-wrap.bottom-right { bottom: 110px; right: 72px; }
.deco-wrap.mid-right    { top: 50%; right: 56px; transform: translateY(-50%); }
.deco-img {
  width: 160px;
  height: auto;
  object-fit: contain;
  display: block;
  opacity: 0.88;
  filter: drop-shadow(0 4px 24px rgba(138,2,255,0.35))
          drop-shadow(0 0 12px rgba(255,41,120,0.20));
}

/* ── Overlay image (mascot / character) ── */
/* Positioned next to the swipe hint row, right side, inset from all edges.
   Color manipulation uses filter: sepia→hue-rotate→saturate applied directly
   to the <img> — this respects PNG transparency so only actual asset pixels
   are re-colored, never the surrounding bounding box. No rectangle artifact. */
.overlay-wrap {
  position: absolute;
  bottom: 320px;
  right: 72px;
  width: 170px;
  z-index: 2;
  transform: rotate(-6deg) perspective(700px) rotateY(-5deg);
  transform-origin: bottom center;
}
.overlay-img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
  opacity: 0.93;
  /* Quarks brand glow: coral inner + violet outer — matches the gradient orb aesthetic */
  filter:
    drop-shadow(0 0 18px rgba(255,41,120,0.70))
    drop-shadow(0 0 40px rgba(138,2,255,0.35))
    drop-shadow(5px 8px 24px rgba(0,0,0,0.90));
}


.cta-v2-slide {
  justify-content: flex-start;
  padding: 72px 80px 140px;
  gap: 0;
}

/* Kicker */
.cta-kicker {
  margin-bottom: 16px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
  text-align: center;
  width: 100%;
}

/* Value line */
.cta-value {
  font-family: var(--font-serif);
  font-size: 86px;
  font-weight: 900;
  line-height: 1.05;
  color: var(--c-text);
  letter-spacing: -0.025em;
  position: relative;
  z-index: 1;
  flex-shrink: 0;
  text-align: center;
  width: 100%;
}

/* Arrow container — centered */
.cta-arrow-wrap {
  display: flex;
  justify-content: center;
  width: 100%;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
  margin-top: 40px;
  margin-bottom: 40px;
}

/* CTA sentence — centered, big */
.cta-sentence {
  font-family: var(--font-display);
  font-size: 64px;
  font-weight: 700;
  color: var(--c-text);
  line-height: 1.15;
  letter-spacing: -0.02em;
  position: relative;
  z-index: 1;
  flex-shrink: 0;
  text-align: center;
  width: 100%;
}
.cta-sentence .cta-keyword {
  color: var(--slide-accent);
  font-weight: 900;
}

/* Assets zone — below CTA, centered, fills remaining space */
.cta-assets {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  margin-top: 56px;
  flex: 1;
  min-height: 0;
  position: relative;
  z-index: 1;
  width: 100%;
}
.cta-asset-logo {
  height: 200px;
  width: auto;
  object-fit: contain;
}
.cta-asset-graphic {
  max-width: 100%;
  max-height: 260px;
  object-fit: contain;
  border-radius: 16px;
}
.cta-asset-illustration {
  max-width: 100%;
  max-height: 280px;
  object-fit: contain;
}

</style>
</head>
